name: Tim Stacey
tagline: 'Software Developer in Test: automation frameworks and engineering standards'
bio: >-
  I spent over three years at Sony Interactive Entertainment building E2E automation across web, API,
  and mobile, and wrapped up there in June 2026. I'm looking for my next role: remote worldwide, perm
  or contract. I push validation into the API and contract layer rather than fight flaky UI flows, and
  I set the engineering bar (strict typing, linting, hooks, tight PR practice) that takes a release
  cycle from days to hours.
contact:
  github: https://github.com/timjstacey
  linkedin: https://www.linkedin.com/in/timjstacey/
experience:
  - company: Sony Interactive Entertainment
    role: Lead Quality Engineer
    start: '2022-10'
    end: '2026-06'
    bullets:
      - Built and owned a central TypeScript E2E framework in Bitbucket (Playwright, Appium, WebdriverIO, Grafana k6) covering web, API, and mobile
      - Took automated E2E coverage from zero to 11 repositories, with a dedicated suite per microservice running on deployment in Bitbucket Pipelines
      - Moved validation out of brittle UI tests and into the API and service layers
      - Dispatched test runs from Bitbucket Pipelines to AWS CodeBuild so suites ran inside the VPC with direct MySQL and MongoDB access for data setup
      - Led the Cypress to Playwright migration, splitting UI from API concerns and cutting full regression from about 45 minutes to under 5, so it ran on every DEV and QA deployment
      - Cut release progression from days to hours on the back of that coverage
      - Rebuilt API suites service by service (challenge, team, user, payment, product catalogue, tournament), each wired into its own deployment pipeline
      - Built a mock of a third-party publisher's game result API to drop the dependency on live partner test accounts and open up load testing of tournament close-out
      - Wrote Grafana k6 scenarios for game result scoring and tournament close-out at scale, then set throughput and latency baselines and alert thresholds from the runs
      - 'Owned automation standards: published conventions in Confluence and enforced them in CI with ESLint, Prettier, strict TypeScript, git hooks, and SonarCloud duplication checks'
      - Led a QE capability of 3 testers, including 2 offshore QA engineers in Vietnam, while staying hands-on in an embedded delivery squad
      - Mentored junior testers and drove framework adoption until developers ran suites themselves and opened PRs against the test code
      - Wrote the squad's quality definition of done, owned the test strategy, and delivered quality for paid entry, Battlefield 6 tournaments, lobby tournaments, and head-to-head challenges
  - company: Entain Australia
    role: Lead Quality Engineer
    start: '2022-03'
    end: '2022-10'
    bullets:
      - Introduced a Cypress E2E regression suite embedded in the UI codebase of a Vue application
      - Stubbed the APIs so developers could run the app and suite locally without a live backend
      - Ran regression in GitLab pipelines on deployment, with parallel execution under 5 minutes
      - Added LCOV reporting to make coverage visible
      - Evaluated Cypress, Playwright, and Selenium and recommended the framework approach the wider team adopted
      - Pushed shift-left practice and stronger developer-owned unit tests across the Go APIs
      - Mentored junior BAs and testers, bringing manual testers into automation
